<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Estoque - Gestão Dinâmica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pink': '#e91e63',
                        'soft-pink': '#f8bbd0',
                        'light-bg': '#f5f5f5',
                        'dark-text': '#262626',
                        'success-green': '#10b981',
                        'danger-red': '#ef4444',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f5f5f5; 
            color: #262626;
            overflow-x: hidden;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        /* Prevenir zoom no iOS */
        input, select, textarea { font-size: 16px !important; }
        
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 5000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .preview-card {
            background: white;
            padding: 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .animate-plus { animation: pulse-green 0.4s ease-out; }
        .animate-minus { animation: pulse-red 0.4s ease-out; }
        @keyframes pulse-green { 0% { color: #10b981; } 50% { transform: scale(1.1); } 100% { color: #e91e63; } }
        @keyframes pulse-red { 0% { color: #ef4444; } 50% { transform: scale(1.1); } 100% { color: #e91e63; } }

        .touch-btn {
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .touch-btn:active { transform: scale(0.96); opacity: 0.8; }
        
        #reader video { border-radius: 20px; object-fit: cover; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <!-- Modal do Scanner -->
    <div id="modal-scanner" class="modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-4 text-center fade-in">
            <h3 class="text-xs font-black uppercase tracking-widest text-gray-400 mb-4">Escanear Produto</h3>
            <div id="reader" style="width: 100%;"></div>
            <button onclick="stopScanner()" class="mt-6 w-full bg-gray-100 py-4 rounded-2xl font-black text-gray-500 uppercase text-[10px] touch-btn">Fechar Scanner</button>
        </div>
    </div>

    <!-- Modal de Impressão -->
    <div id="qr-preview-modal" class="modal-overlay">
        <div class="preview-card fade-in">
            <div id="label-to-print" class="bg-white border-2 border-gray-100 p-6 rounded-2xl mb-6 flex flex-col items-center">
                <span style="font-size: 10px; color: #e91e63; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;">Estoque Pro</span>
                <h2 id="print-name" style="font-size: 18px; font-weight: 900; margin: 10px 0; color: #000; text-transform: uppercase; line-height: 1.2;">NOME</h2>
                <div id="print-qrcode-wrapper" class="flex justify-center items-center" style="padding: 10px; background: #fff; min-height: 180px; min-width: 180px;"></div>
                <p id="print-id" style="font-size: 14px; font-weight: 900; color: #666; font-family: monospace; letter-spacing: 1px;">ID: 0000</p>
            </div>
            <div class="space-y-3">
                <button onclick="executePrint()" class="w-full bg-primary-pink text-white py-4 rounded-2xl font-black text-sm shadow-xl flex items-center justify-center gap-2 uppercase tracking-widest touch-btn">
                    <i data-lucide="printer" class="w-5 h-5"></i> Imprimir Etiqueta
                </button>
                <button onclick="closeQrModal()" class="w-full text-gray-400 py-2 font-bold text-[11px] uppercase tracking-widest">Fechar Prévia</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
        <div class="px-4 py-4 flex justify-between items-center max-w-4xl mx-auto">
            <h1 class="text-xl font-black text-primary-pink flex items-center tracking-tighter">
                <i data-lucide="package" class="mr-2 w-5 h-5"></i> ESTOQUE PRO
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="filterLowStock()" class="relative p-2 text-gray-400 touch-btn">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span id="alert-badge" class="hidden absolute top-1 right-1 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold border-2 border-white">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full space-y-4">
        <!-- Botões Rápidos -->
        <section class="grid grid-cols-4 gap-2">
            <button onclick="startScanner()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 touch-btn">
                <div class="p-2 bg-pink-100 rounded-full mb-1 text-primary-pink"><i data-lucide="qr-code" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Scanner</span>
            </button>
            <button onclick="filterLowStock()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 touch-btn">
                <div class="p-2 bg-red-100 rounded-full mb-1 text-red-600"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Alertas</span>
            </button>
            <button onclick="resetFilters()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 touch-btn">
                <div class="p-2 bg-gray-100 rounded-full mb-1 text-gray-600"><i data-lucide="list" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Todos</span>
            </button>
            <button onclick="scrollToAdd()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 touch-btn">
                <div class="p-2 bg-green-100 rounded-full mb-1 text-green-600"><i data-lucide="plus" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Novo</span>
            </button>
        </section>

        <!-- Filtros -->
        <div id="category-chips" class="flex gap-2 overflow-x-auto hide-scroll py-2 px-1"></div>

        <!-- Cadastro Rápido -->
        <section id="section-add" class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100">
            <h2 class="text-[10px] font-black mb-4 flex items-center uppercase tracking-widest text-gray-400">Novo Produto</h2>
            <div class="space-y-4">
                <div class="flex items-center gap-4">
                    <div id="image-placeholder" onclick="triggerFileInput('main')" class="w-20 h-20 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex items-center justify-center shrink-0 cursor-pointer">
                        <i data-lucide="image-plus" class="w-6 h-6 text-gray-300"></i>
                    </div>
                    <div id="image-preview-container" onclick="triggerFileInput('main')" class="hidden relative w-20 h-20 shrink-0 cursor-pointer">
                        <img id="image-preview" src="" class="w-full h-full object-cover rounded-2xl">
                    </div>
                    <div class="flex-grow">
                        <input type="text" id="prod-name" placeholder="Nome do produto..." class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none mb-2 text-sm font-semibold">
                        <select id="prod-category" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none text-sm"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Qtd</label>
                        <input type="number" id="prod-qty" value="0" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                    <div class="bg-gray-50 rounded-xl p-3">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Mín</label>
                        <input type="number" id="prod-alert" value="2" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                </div>
                <button onclick="saveProduct()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg uppercase text-[12px] tracking-widest touch-btn">Salvar No Estoque</button>
            </div>
        </section>

        <!-- Busca -->
        <div class="relative">
            <input type="text" id="global-search" placeholder="Pesquisar estoque..." class="w-full bg-white border-none shadow-sm rounded-2xl p-4 pl-12 outline-none text-sm">
            <i data-lucide="search" class="absolute left-4 top-4 text-gray-300 w-5 h-5"></i>
        </div>

        <!-- Lista de Itens -->
        <div id="inventory-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-24"></div>
    </main>

    <!-- Modal Edição (GERENCIADOR) -->
    <div id="modal-edit" class="modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-6 fade-in shadow-2xl max-h-[90vh] overflow-y-auto hide-scroll">
            <div class="flex justify-between items-center mb-6">
                <button id="btn-delete" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                <div onclick="triggerFileInput('edit')" class="w-24 h-24 rounded-3xl overflow-hidden shadow-lg border-2 border-white cursor-pointer bg-gray-100">
                    <img id="edit-img" class="w-full h-full object-cover" src="">
                </div>
                <button onclick="prepareQRPreview()" class="p-3 bg-pink-50 text-primary-pink rounded-xl shadow-sm"><i data-lucide="printer" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3 mb-6">
                <input type="text" id="edit-name-input" class="w-full bg-gray-50 rounded-2xl p-4 font-black text-gray-700 outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <select id="edit-cat-select" class="bg-gray-50 rounded-2xl p-4 font-bold text-xs outline-none"></select>
                    <div class="bg-gray-50 rounded-2xl p-4 text-center">
                        <label class="text-[8px] font-black text-gray-300 uppercase block">Alerta</label>
                        <input type="number" id="edit-alert-input" class="w-full text-center bg-transparent font-black outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-5 rounded-3xl text-center mb-6">
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Saldo Atual</span>
                <div id="edit-qty-display" class="text-6xl font-black text-primary-pink my-3">0</div>
                
                <div class="flex items-center gap-3">
                    <button onclick="adjustTempByValue(-1)" class="w-14 h-14 bg-danger-red text-white rounded-2xl flex items-center justify-center shadow-lg touch-btn"><i data-lucide="minus"></i></button>
                    <div class="flex-grow bg-white rounded-2xl p-2 border border-gray-100">
                        <label class="text-[8px] font-black text-gray-300 uppercase block">Passo</label>
                        <input type="number" id="step-value" value="1" class="w-full text-center text-xl font-black bg-transparent outline-none">
                    </div>
                    <button onclick="adjustTempByValue(1)" class="w-14 h-14 bg-success-green text-white rounded-2xl flex items-center justify-center shadow-lg touch-btn"><i data-lucide="plus"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeEditModal()" class="w-full bg-gray-100 text-gray-400 font-black py-4 rounded-2xl uppercase text-[11px] touch-btn">Cancelar</button>
                <button onclick="saveEditChanges()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg uppercase text-[11px] touch-btn">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Inputs de arquivo escondidos -->
    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'main')">
    <input type="file" id="edit-file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'edit')">

    <script>
        // Banco de Dados Local
        let products = JSON.parse(localStorage.getItem('stock_pro_db')) || [];
        let categories = JSON.parse(localStorage.getItem('stock_pro_cats')) || ['Geral', 'Peças', 'Ferramentas', 'Insumos'];
        let selectedProduct = null;
        let currentPhoto = null;
        let html5QrCode = null;
        let tempQty = 0;
        let activeFilterTag = "TODOS";

        window.onload = () => {
            lucide.createIcons();
            renderCategories();
            renderInventory();
            updateBadge();
            initDeleteHandler();
        };

        function saveDb() {
            localStorage.setItem('stock_pro_db', JSON.stringify(products));
            updateBadge();
        }

        // --- SCANNER ---
        function startScanner() {
            document.getElementById('modal-scanner').style.display = 'flex';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                const found = products.find(p => p.id === decodedText.trim());
                if (found) { 
                    stopScanner(); 
                    setTimeout(() => openEditModal(found.id), 300);
                }
            }).catch(err => console.error(err));
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => { 
                    document.getElementById('modal-scanner').style.display = 'none'; 
                });
            } else {
                document.getElementById('modal-scanner').style.display = 'none';
            }
        }

        // --- CATEGORIAS & FILTROS ---
        function renderCategories() {
            const s1 = document.getElementById('prod-category');
            const s2 = document.getElementById('edit-cat-select');
            const opts = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            if(s1) s1.innerHTML = opts; 
            if(s2) s2.innerHTML = opts;
            renderCategoryChips();
        }

        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            const all = ["TODOS", ...categories];
            container.innerHTML = all.map(c => `
                <button onclick="filterByCategory('${c}')" class="whitespace-nowrap px-5 py-2 rounded-full text-[10px] font-black uppercase border transition-all ${activeFilterTag === c ? 'bg-primary-pink text-white border-primary-pink shadow-md' : 'bg-white text-gray-400 border-gray-100'}">
                    ${c}
                </button>
            `).join('');
        }

        function filterByCategory(cat) {
            activeFilterTag = cat;
            renderCategoryChips();
            if (cat === "TODOS") renderInventory();
            else renderSpecificList(products.filter(p => p.category === cat));
        }

        function resetFilters() {
            activeFilterTag = "TODOS";
            document.getElementById('global-search').value = "";
            renderCategoryChips();
            renderInventory();
        }

        function scrollToAdd() {
            document.getElementById('section-add').scrollIntoView({ behavior: 'smooth' });
        }

        // --- INVENTÁRIO ---
        function renderInventory(term = "") {
            const list = products.filter(p => 
                p.name.toLowerCase().includes(term.toLowerCase()) || 
                p.id.toLowerCase().includes(term.toLowerCase())
            );
            renderSpecificList(list);
        }

        function renderSpecificList(list) {
            const container = document.getElementById('inventory-list');
            if (list.length === 0) {
                container.innerHTML = `<div class="col-span-full py-10 text-center text-gray-300 font-bold uppercase text-[10px] tracking-widest">Nenhum item encontrado</div>`;
                return;
            }
            container.innerHTML = list.map(p => `
                <div onclick="openEditModal('${p.id}')" class="bg-white p-4 rounded-3xl shadow-sm border border-gray-50 flex items-center gap-4 cursor-pointer active:scale-95 transition-all">
                    <div class="w-14 h-14 rounded-2xl overflow-hidden bg-gray-100 shrink-0">
                        <img src="${p.image || 'https://via.placeholder.com/100?text=📦'}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-grow overflow-hidden">
                        <h4 class="font-black text-gray-800 uppercase text-[11px] truncate">${p.name}</h4>
                        <p class="text-[8px] font-bold text-gray-300 uppercase">${p.category} • ID: ${p.id}</p>
                    </div>
                    <div class="text-2xl font-black ${p.qty <= (p.alert || 0) ? 'text-red-500' : 'text-primary-pink'}">${p.qty}</div>
                </div>
            `).join('');
        }

        function saveProduct() {
            const name = document.getElementById('prod-name').value.trim();
            if(!name) return;
            
            const newProd = {
                id: Math.random().toString(36).substr(2, 4).toUpperCase(),
                name,
                category: document.getElementById('prod-category').value,
                qty: parseInt(document.getElementById('prod-qty').value) || 0,
                alert: parseInt(document.getElementById('prod-alert').value) || 2,
                image: currentPhoto
            };
            
            products.unshift(newProd);
            saveDb(); 
            renderInventory();
            
            // Reset campos
            document.getElementById('prod-name').value = "";
            document.getElementById('prod-qty').value = "0";
            clearImage();
        }

        // --- EDIÇÃO ---
        function openEditModal(id) {
            selectedProduct = products.find(p => p.id === id);
            if(!selectedProduct) return;
            
            tempQty = selectedProduct.qty;
            document.getElementById('edit-name-input').value = selectedProduct.name;
            document.getElementById('edit-cat-select').value = selectedProduct.category;
            document.getElementById('edit-alert-input').value = selectedProduct.alert;
            document.getElementById('edit-qty-display').innerText = tempQty;
            document.getElementById('edit-img').src = selectedProduct.image || 'https://via.placeholder.com/150?text=Sem+Foto';
            
            resetDeleteButton();
            document.getElementById('modal-edit').style.display = 'flex';
        }

        function adjustTempByValue(d) {
            const s = parseInt(document.getElementById('step-value').value) || 1;
            tempQty = Math.max(0, tempQty + (d * s));
            const display = document.getElementById('edit-qty-display');
            display.innerText = tempQty;
            display.classList.remove('animate-plus', 'animate-minus');
            void display.offsetWidth; // trigger reflow
            display.classList.add(d > 0 ? 'animate-plus' : 'animate-minus');
        }

        function saveEditChanges() {
            const idx = products.findIndex(p => p.id === selectedProduct.id);
            if(idx !== -1) {
                products[idx].name = document.getElementById('edit-name-input').value;
                products[idx].category = document.getElementById('edit-cat-select').value;
                products[idx].alert = parseInt(document.getElementById('edit-alert-input').value);
                products[idx].qty = tempQty;
                saveDb(); 
                renderInventory();
            }
            closeEditModal();
        }

        function closeEditModal() { document.getElementById('modal-edit').style.display = 'none'; }

        // --- EXCLUSÃO ---
        function initDeleteHandler() {
            const btn = document.getElementById('btn-delete');
            btn.onclick = () => {
                if (btn.getAttribute('data-confirm') !== 'true') {
                    btn.setAttribute('data-confirm', 'true');
                    btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>';
                    btn.className = "p-3 bg-red-600 text-white rounded-xl shadow-lg animate-bounce";
                    lucide.createIcons();
                    setTimeout(resetDeleteButton, 3000);
                } else {
                    products = products.filter(p => p.id !== selectedProduct.id);
                    saveDb(); closeEditModal(); renderInventory();
                }
            };
        }

        function resetDeleteButton() {
            const btn = document.getElementById('btn-delete');
            if(btn) {
                btn.setAttribute('data-confirm', 'false');
                btn.className = "p-3 bg-red-50 text-red-500 rounded-xl";
                btn.innerHTML = '<i data-lucide="trash-2" class="w-5 h-5"></i>';
                lucide.createIcons();
            }
        }

        // --- IMPRESSÃO / QR CODE ---
        function prepareQRPreview() {
            closeEditModal();
            const wrapper = document.getElementById('print-qrcode-wrapper');
            wrapper.innerHTML = "";
            document.getElementById('print-name').innerText = selectedProduct.name;
            document.getElementById('print-id').innerText = "ID: " + selectedProduct.id;
            document.getElementById('qr-preview-modal').style.display = 'flex';
            setTimeout(() => {
                new QRCode(wrapper, { text: selectedProduct.id, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.H });
            }, 100);
        }

        function executePrint() {
            const content = document.getElementById('label-to-print').innerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html><head><title>Etiqueta</title>
                <style>
                    body { font-family: sans-serif; text-align: center; padding: 20px; }
                    img { max-width: 180px; margin: 10px auto; }
                </style></head>
                <body>${content}<script>window.onload=()=>{setTimeout(()=>{window.print();window.close();},500);}<\/script></body></html>
            `);
            printWindow.document.close();
        }

        function closeQrModal() { document.getElementById('qr-preview-modal').style.display = 'none'; }

        // --- IMAGENS (COM COMPRESSÃO) ---
        function triggerFileInput(m) { 
            (m === 'main' ? document.getElementById('file-input') : document.getElementById('edit-file-input')).click(); 
        }

        function handleFileUpload(event, mode) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; // Otimizado para mobile/storage
                    const scale = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    
                    if (mode === 'main') {
                        currentPhoto = dataUrl;
                        document.getElementById('image-placeholder').classList.add('hidden');
                        document.getElementById('image-preview').src = dataUrl;
                        document.getElementById('image-preview-container').classList.remove('hidden');
                    } else {
                        selectedProduct.image = dataUrl;
                        document.getElementById('edit-img').src = dataUrl;
                        saveDb(); renderInventory();
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImage() { 
            currentPhoto = null; 
            document.getElementById('image-preview-container').classList.add('hidden'); 
            document.getElementById('image-placeholder').classList.remove('hidden'); 
        }
        
        function updateBadge() {
            const l = products.filter(p => p.qty <= (p.alert || 0)).length;
            const b = document.getElementById('alert-badge');
            if (b) { b.innerText = l; (l > 0 ? b.classList.remove('hidden') : b.classList.add('hidden')); }
        }
        
        function filterLowStock() { 
            activeFilterTag = ""; renderCategoryChips();
            renderSpecificList(products.filter(p => p.qty <= (p.alert || 0))); 
        }
        
        document.getElementById('global-search').addEventListener('input', (e) => renderInventory(e.target.value));
    </script>
</body>
</html>
