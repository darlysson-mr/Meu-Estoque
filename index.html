<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Estoque - Gestão Dinâmica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pink': '#e91e63',
                        'soft-pink': '#f8bbd0',
                        'light-bg': '#f5f5f5',
                        'dark-text': '#262626',
                        'success-green': '#10b981',
                        'danger-red': '#ef4444',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f5f5f5; 
            color: #262626;
            overflow-x: hidden;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }
        
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 5000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #label-preview-content {
            background: white;
            border: 2px dashed #eee;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        /* Melhorias Mobile */
        input, select { font-size: 16px !important; }
        
        .touch-btn {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .touch-btn:active { transform: scale(0.96); opacity: 0.9; }

        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #262626;
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 800;
            z-index: 9999;
            display: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <div id="toast">Aviso</div>

    <!-- Modal QR Code -->
    <div id="qr-preview-modal" class="modal-overlay">
        <div class="bg-white p-6 rounded-[2rem] w-full max-w-sm text-center shadow-2xl fade-in">
            <div id="label-preview-content">
                <p style="font-size: 10px; color: #e91e63; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; text-transform: uppercase;">Estoque Pro</p>
                <h2 id="print-name" style="font-size: 18px; font-weight: 900; margin-bottom: 12px; color: #000; text-transform: uppercase;">NOME</h2>
                <div id="print-qrcode-wrapper" style="display: flex; justify-content: center; margin: 15px auto; min-height: 180px;"></div>
                <p id="print-id" style="font-size: 14px; font-weight: 900; color: #000; font-family: monospace;">ID: 000000</p>
            </div>
            <div class="space-y-3">
                <button onclick="executePrint()" class="w-full bg-primary-pink text-white py-4 rounded-2xl font-black text-sm uppercase touch-btn">
                    Imprimir Etiqueta
                </button>
                <button onclick="document.getElementById('qr-preview-modal').style.display='none'" class="w-full text-gray-400 font-bold text-[10px] uppercase">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Header Principal -->
    <header class="bg-white shadow-sm sticky top-0 z-40 w-full px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-black text-primary-pink flex items-center tracking-tighter">
            <i data-lucide="package" class="mr-2 w-5 h-5"></i> ESTOQUE
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="filterLowStock()" class="relative p-2 text-gray-400">
                <i data-lucide="bell" class="w-6 h-6"></i>
                <span id="alert-badge" class="hidden absolute top-0 right-0 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
            </button>
            <button onclick="openTagsManager()" class="p-2 text-gray-400"><i data-lucide="settings" class="w-6 h-6"></i></button>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full space-y-4">
        
        <!-- Atalhos/Estatísticas -->
        <section class="grid grid-cols-4 gap-2">
            <button onclick="triggerFileInput()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-pink-50">
                <div class="p-2 bg-pink-100 rounded-full mb-1 text-primary-pink"><i data-lucide="camera" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Foto</span>
            </button>
            <button onclick="filterLowStock()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-red-50">
                <div class="p-2 bg-red-100 rounded-full mb-1 text-red-600"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Crítico</span>
            </button>
            <button onclick="openTagsManager()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-orange-50">
                <div class="p-2 bg-orange-100 rounded-full mb-1 text-orange-600"><i data-lucide="tag" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Tags</span>
            </button>
            <button onclick="renderInventory()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50">
                <div class="p-2 bg-gray-100 rounded-full mb-1 text-gray-600"><i data-lucide="list" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Todos</span>
            </button>
        </section>

        <!-- Filtro de Categorias -->
        <div id="category-chips" class="flex gap-2 overflow-x-auto hide-scroll py-1"></div>

        <!-- Formulário de Cadastro (Tua Estrutura) -->
        <section class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100">
            <h2 class="text-[10px] font-black mb-4 flex items-center uppercase tracking-widest text-gray-400">
                <i data-lucide="plus-circle" class="mr-2 w-4 h-4 text-primary-pink"></i> Novo Cadastro
            </h2>
            
            <div class="space-y-4">
                <div class="flex items-center gap-4">
                    <div id="image-placeholder" onclick="triggerFileInput()" class="w-20 h-20 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center shrink-0">
                        <i data-lucide="image-plus" class="w-6 h-6 text-gray-300"></i>
                    </div>
                    <div id="image-preview-container" class="hidden relative w-20 h-20 shrink-0">
                        <img id="image-preview" src="" class="w-full h-full object-cover rounded-2xl shadow-sm">
                        <button onclick="clearImage()" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-1"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>
                    <div class="flex-grow">
                        <input type="text" id="prod-name" placeholder="Nome do item..." class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none mb-2">
                        <select id="prod-category" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Estoque</label>
                        <input type="number" id="prod-qty" value="0" inputmode="numeric" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                    <div class="bg-gray-50 rounded-xl p-3">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Alerta</label>
                        <input type="number" id="prod-alert" value="2" inputmode="numeric" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                </div>
                
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFile(event)">
                
                <button id="btn-save" onclick="saveProduct()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg uppercase text-[12px] tracking-widest touch-btn">
                    Confirmar Cadastro
                </button>
            </div>
        </section>

        <!-- Barra de Pesquisa -->
        <div class="relative w-full">
            <input type="text" id="global-search" placeholder="Pesquisar no estoque..." class="w-full bg-white border-none shadow-sm rounded-2xl p-4 pl-12 outline-none">
            <i data-lucide="search" class="absolute left-4 top-4 text-gray-300 w-5 h-5"></i>
        </div>

        <!-- Lista de Produtos -->
        <div id="inventory-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-24"></div>
    </main>

    <!-- Modal Edição (Tua Estrutura) -->
    <div id="modal-edit" class="modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-6 fade-in shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <button id="btn-delete" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                <div class="w-24 h-24 rounded-3xl overflow-hidden shadow-lg border-2 border-white">
                    <img id="edit-img" class="w-full h-full object-cover">
                </div>
                <button onclick="prepareQRPreview()" class="p-3 bg-pink-50 text-primary-pink rounded-xl"><i data-lucide="printer" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3 mb-6">
                <div class="bg-gray-50 p-3 rounded-2xl">
                    <label class="text-[9px] font-black text-gray-300 uppercase">Produto</label>
                    <input type="text" id="edit-name" class="w-full bg-transparent border-none p-1 font-black outline-none">
                </div>
                <div class="bg-gray-50 p-5 rounded-3xl text-center">
                    <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Saldo Atual</span>
                    <div id="edit-qty-display" class="text-6xl font-black text-primary-pink my-3">0</div>
                    <div class="flex justify-center gap-6 mt-4">
                        <button onclick="adjustEditQty(-1)" class="w-14 h-14 bg-red-500 text-white rounded-2xl shadow-lg font-black text-2xl">-</button>
                        <button onclick="adjustEditQty(1)" class="w-14 h-14 bg-emerald-500 text-white rounded-2xl shadow-lg font-black text-2xl">+</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="document.getElementById('modal-edit').style.display='none'" class="w-full bg-gray-100 text-gray-400 font-black py-4 rounded-2xl uppercase text-[11px]">Sair</button>
                <button onclick="confirmEdit()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg uppercase text-[11px]">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('stock_v8')) || [];
        let categories = JSON.parse(localStorage.getItem('cats_v8')) || ['Geral', 'Cozinha', 'Limpeza'];
        let currentPhoto = null;
        let activeId = null;

        window.onload = () => {
            renderInventory();
            renderCategoryChips();
            fillSelects();
            lucide.createIcons();
            initDelete();
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function fillSelects() {
            const sel = document.getElementById('prod-category');
            sel.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function triggerFileInput() { document.getElementById('file-input').click(); }

        async function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            showToast("A processar...");
            const reader = new FileReader();
            reader.onload = async (ev) => {
                // Compressão agressiva para mobile
                currentPhoto = await compress(ev.target.result, 400, 0.6);
                document.getElementById('image-preview').src = currentPhoto;
                document.getElementById('image-placeholder').classList.add('hidden');
                document.getElementById('image-preview-container').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function compress(src, max, q) {
            return new Promise(res => {
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if(w > max) { h = Math.round((h * max) / w); w = max; }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    res(canvas.toDataURL('image/jpeg', q));
                };
            });
        }

        function saveProduct() {
            const name = document.getElementById('prod-name').value.trim();
            const qty = parseInt(document.getElementById('prod-qty').value) || 0;
            const alert = parseInt(document.getElementById('prod-alert').value) || 0;
            const cat = document.getElementById('prod-category').value;

            if(!name) return showToast("Digite o nome!");

            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.innerText = "A GUARDAR...";

            const newItem = {
                id: Math.random().toString(36).substr(2, 6).toUpperCase(),
                name, qty, alert, category: cat,
                image: currentPhoto
            };

            try {
                products.unshift(newItem);
                localStorage.setItem('stock_v8', JSON.stringify(products));
                
                // Reset
                document.getElementById('prod-name').value = "";
                document.getElementById('prod-qty').value = "0";
                clearImage();
                renderInventory();
                showToast("Item Cadastrado!");
            } catch (e) {
                showToast("Memória cheia!");
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirmar Cadastro";
            }
        }

        function renderInventory(term = "") {
            const list = document.getElementById('inventory-list');
            const search = term.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(search));

            list.innerHTML = filtered.map(p => {
                const isLow = p.qty <= p.alert;
                return `
                <div onclick="openEdit('${p.id}')" class="bg-white p-4 rounded-3xl flex items-center gap-4 border ${isLow ? 'border-red-100 bg-red-50' : 'border-gray-50'} active:scale-95 transition">
                    <img src="${p.image || 'https://via.placeholder.com/100'}" class="w-14 h-14 rounded-2xl object-cover bg-gray-50">
                    <div class="flex-grow">
                        <h4 class="font-black text-[11px] text-gray-800 uppercase truncate">${p.name}</h4>
                        <span class="text-[9px] text-gray-300 font-bold uppercase">${p.category}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-2xl font-black ${isLow ? 'text-red-500' : 'text-primary-pink'}">${p.qty}</span>
                    </div>
                </div>
                `;
            }).join('');
            
            const low = products.filter(p => p.qty <= p.alert).length;
            const b = document.getElementById('alert-badge');
            b.innerText = low;
            low > 0 ? b.classList.remove('hidden') : b.classList.add('hidden');
            lucide.createIcons();
        }

        function openEdit(id) {
            activeId = id;
            const p = products.find(x => x.id === id);
            document.getElementById('edit-name').value = p.name;
            document.getElementById('edit-qty-display').innerText = p.qty;
            document.getElementById('edit-img').src = p.image || 'https://via.placeholder.com/100';
            document.getElementById('modal-edit').style.display = 'flex';
            resetDelBtn();
        }

        function adjustEditQty(val) {
            const el = document.getElementById('edit-qty-display');
            let n = parseInt(el.innerText) + val;
            el.innerText = Math.max(0, n);
        }

        function confirmEdit() {
            const p = products.find(x => x.id === activeId);
            p.name = document.getElementById('edit-name').value;
            p.qty = parseInt(document.getElementById('edit-qty-display').innerText);
            localStorage.setItem('stock_v8', JSON.stringify(products));
            renderInventory();
            document.getElementById('modal-edit').style.display = 'none';
            showToast("Atualizado!");
        }

        function initDelete() {
            const btn = document.getElementById('btn-delete');
            btn.onclick = () => {
                if(btn.dataset.confirm !== '1') {
                    btn.dataset.confirm = '1';
                    btn.innerHTML = '<i data-lucide="check"></i>';
                    btn.classList.replace('bg-red-50', 'bg-red-600');
                    btn.classList.replace('text-red-500', 'text-white');
                    lucide.createIcons();
                    setTimeout(resetDelBtn, 3000);
                } else {
                    products = products.filter(x => x.id !== activeId);
                    localStorage.setItem('stock_v8', JSON.stringify(products));
                    renderInventory();
                    document.getElementById('modal-edit').style.display = 'none';
                    showToast("Excluído");
                }
            };
        }

        function resetDelBtn() {
            const btn = document.getElementById('btn-delete');
            btn.dataset.confirm = '0';
            btn.innerHTML = '<i data-lucide="trash-2"></i>';
            btn.className = "p-3 bg-red-50 text-red-500 rounded-xl";
            lucide.createIcons();
        }

        function clearImage() {
            currentPhoto = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-placeholder').classList.remove('hidden');
            document.getElementById('file-input').value = "";
        }

        function prepareQRPreview() {
            const p = products.find(x => x.id === activeId);
            const wrapper = document.getElementById('print-qrcode-wrapper');
            wrapper.innerHTML = "";
            document.getElementById('print-name').innerText = p.name;
            document.getElementById('print-id').innerText = "ID: " + p.id;
            document.getElementById('qr-preview-modal').style.display = 'flex';
            
            setTimeout(() => {
                new QRCode(wrapper, { text: p.id, width: 180, height: 180 });
            }, 300);
        }

        function executePrint() {
            const win = window.open('', '_blank');
            const content = document.getElementById('label-preview-content').innerHTML;
            win.document.write(`<html><body style="text-align:center;padding:50px;font-family:sans-serif;">${content}<script>setTimeout(()=> {window.print(); window.close();}, 500)<\/script></body></html>`);
            win.document.close();
        }

        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            const all = ["TODOS", ...categories];
            container.innerHTML = all.map(c => `<button class="px-4 py-2 bg-white rounded-full text-[10px] font-black uppercase border border-gray-100 text-gray-400">${c}</button>`).join('');
        }

        document.getElementById('global-search').addEventListener('input', (e) => renderInventory(e.target.value));
    </script>
</body>
</html>
