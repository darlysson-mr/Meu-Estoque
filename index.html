<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque Pessoal - Controle com Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pink': '#e91e63',
                        'soft-pink': '#f8bbd0',
                        'light-bg': '#f5f5f5',
                        'dark-text': '#262626',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .active-tab { border-bottom: 3px solid #e91e63; color: #e91e63; }
        .hidden { display: none; }
        .tab-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-light-bg text-dark-text font-sans pb-24">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-4xl mx-auto">
            <h1 class="text-xl font-bold text-primary-pink flex items-center">
                <i data-lucide="package" class="mr-2"></i> Meu Estoque
            </h1>
            <div id="feedback" class="hidden text-sm font-medium px-3 py-1 rounded-full transition-all duration-300"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4">
        
        <!-- Aba: Visualizar Estoque -->
        <section id="view-inventory" class="tab-content">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-xl font-bold">Itens em Estoque</h2>
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchInventory" placeholder="Buscar produto..." class="w-full pl-10 pr-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-pink border-gray-200 shadow-sm">
                    <i data-lucide="search" class="absolute left-3 top-2.5 text-gray-400 w-5 h-5"></i>
                </div>
            </div>
            <div id="inventoryList" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Itens injetados via JS -->
            </div>
        </section>

        <!-- Aba: Ajustar Estoque -->
        <section id="adjust-stock" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-6">Ajustar ou Adicionar</h2>
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6">
                <div class="flex items-center gap-3 mb-4 text-gray-600">
                    <i data-lucide="barcode" class="w-5 h-5 text-primary-pink"></i>
                    <p class="text-sm">Escaneie o código para editar ou cadastrar.</p>
                </div>
                <div id="reader" class="rounded-2xl overflow-hidden border-2 border-dashed border-gray-200 mb-6 bg-gray-50"></div>
                <button id="startScanBtn" class="w-full bg-primary-pink text-white py-4 rounded-2xl font-bold shadow-lg shadow-pink-100 hover:bg-pink-700 transition flex items-center justify-center">
                    <i data-lucide="camera" class="mr-2"></i> Iniciar Scanner
                </button>
            </div>

            <!-- Formulário de Ajuste -->
            <div id="adjustForm" class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 hidden animate-pulse-once">
                <div class="flex flex-col sm:flex-row items-center gap-6 mb-8">
                    <div class="w-32 h-32 bg-gray-50 rounded-2xl flex items-center justify-center overflow-hidden border-2 border-gray-100 relative group shadow-inner">
                        <img id="adjustImg" src="" class="w-full h-full object-cover hidden">
                        <i id="adjustPlaceholder" data-lucide="image-plus" class="text-gray-300 w-10 h-10"></i>
                        <label class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center cursor-pointer transition-opacity duration-300">
                            <span class="text-white text-xs font-bold">ALTERAR FOTO</span>
                            <input type="file" id="adjustFileInput" accept="image/*" class="hidden">
                        </label>
                    </div>
                    <div class="flex-1 w-full">
                        <span class="text-[10px] font-bold tracking-widest text-gray-400 uppercase mb-1 block" id="adjustBarcodeLabel">Código de Barras</span>
                        <p class="text-sm font-mono text-gray-700 mb-4 bg-gray-50 p-2 rounded-lg inline-block" id="adjustBarcodeText"></p>
                        <input type="text" id="adjustName" placeholder="Nome do Produto" class="w-full text-xl font-bold border-b-2 focus:outline-none border-gray-100 focus:border-primary-pink py-2 transition-colors">
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-gray-50 p-6 rounded-2xl">
                        <label class="block text-sm font-bold text-gray-500 uppercase tracking-wider mb-4 text-center">Quantidade Atual</label>
                        <div class="flex items-center justify-center gap-8">
                            <button onclick="changeAdjustQty(-1)" class="w-12 h-12 flex items-center justify-center bg-white border border-gray-200 rounded-xl hover:bg-gray-100 shadow-sm transition">
                                <i data-lucide="minus" class="text-gray-600"></i>
                            </button>
                            <input type="number" id="adjustQty" class="w-24 text-center text-3xl font-black bg-transparent border-none focus:outline-none" value="0">
                            <button onclick="changeAdjustQty(1)" class="w-12 h-12 flex items-center justify-center bg-white border border-gray-200 rounded-xl hover:bg-gray-100 shadow-sm transition">
                                <i data-lucide="plus" class="text-gray-600"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button id="saveAdjustBtn" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold shadow-lg shadow-green-100 hover:bg-green-600 transition flex items-center justify-center gap-2">
                        <i data-lucide="check-circle"></i> Salvar Alterações
                    </button>
                </div>
            </div>
        </section>

        <!-- Aba: Histórico -->
        <section id="history" class="tab-content hidden">
            <h2 class="text-xl font-bold mb-6">Histórico</h2>
            <div id="historyList" class="space-y-4">
                <!-- Movimentações injetadas via JS -->
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-gray-100 flex justify-around p-4 z-50">
        <button onclick="switchTab('view-inventory')" class="flex flex-col items-center gap-1 active-tab nav-item transition-all" id="nav-view">
            <i data-lucide="layout-grid" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Estoque</span>
        </button>
        <button onclick="switchTab('adjust-stock')" class="flex flex-col items-center gap-1 nav-item transition-all" id="nav-adjust">
            <i data-lucide="plus-circle" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Ajustar</span>
        </button>
        <button onclick="switchTab('history')" class="flex flex-col items-center gap-1 nav-item transition-all" id="nav-history">
            <i data-lucide="scroll-text" class="w-6 h-6"></i>
            <span class="text-[10px] font-bold uppercase">Histórico</span>
        </button>
    </nav>

    <script>
        // --- State Management ---
        let inventory = JSON.parse(localStorage.getItem('my_inventory')) || {};
        let historyLog = JSON.parse(localStorage.getItem('my_history')) || [];
        let currentBarcode = null;
        let html5QrCode = null;
        let selectedImageData = null;

        // --- Core Functions ---

        function saveToStorage() {
            localStorage.setItem('my_inventory', JSON.stringify(inventory));
            localStorage.setItem('my_history', JSON.stringify(historyLog));
            renderInventory();
            renderHistory();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-tab'));
            const baseId = tabId.split('-')[0];
            document.getElementById('nav-' + baseId).classList.add('active-tab');
            
            if (tabId !== 'adjust-stock') stopScanner();
            lucide.createIcons();
        }

        function showFeedback(msg, isError = false) {
            const fb = document.getElementById('feedback');
            fb.textContent = msg;
            fb.className = isError 
                ? 'block text-xs font-bold px-4 py-2 rounded-full bg-red-100 text-red-600 animate-bounce'
                : 'block text-xs font-bold px-4 py-2 rounded-full bg-green-100 text-green-600';
            fb.classList.remove('hidden');
            setTimeout(() => fb.classList.add('hidden'), 3000);
        }

        // --- Scanner Logic ---
        function startScanner() {
            const btn = document.getElementById('startScanBtn');
            
            if (html5QrCode && html5QrCode.isScanning) {
                stopScanner();
                return;
            }

            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 250 } };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
            .then(() => {
                btn.innerHTML = '<i data-lucide="square" class="mr-2"></i> Parar Scanner';
                btn.classList.replace('bg-primary-pink', 'bg-red-500');
                lucide.createIcons();
            }).catch(err => showFeedback("Erro na câmera", true));
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    const btn = document.getElementById('startScanBtn');
                    btn.innerHTML = '<i data-lucide="camera" class="mr-2"></i> Iniciar Scanner';
                    btn.classList.replace('bg-red-500', 'bg-primary-pink');
                    lucide.createIcons();
                });
            }
        }

        function onScanSuccess(barcode) {
            currentBarcode = barcode;
            stopScanner();
            const form = document.getElementById('adjustForm');
            form.classList.remove('hidden');
            document.getElementById('adjustBarcodeText').textContent = barcode;
            
            const item = inventory[barcode];
            const imgEl = document.getElementById('adjustImg');
            const placeholder = document.getElementById('adjustPlaceholder');
            const nameEl = document.getElementById('adjustName');
            const qtyEl = document.getElementById('adjustQty');

            if (item) {
                nameEl.value = item.name;
                qtyEl.value = item.qty;
                if (item.image) {
                    imgEl.src = item.image;
                    imgEl.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    selectedImageData = item.image;
                } else {
                    imgEl.classList.add('hidden');
                    placeholder.classList.remove('hidden');
                    selectedImageData = null;
                }
            } else {
                nameEl.value = "";
                qtyEl.value = 0;
                imgEl.classList.add('hidden');
                placeholder.classList.remove('hidden');
                selectedImageData = null;
            }
            lucide.createIcons();
        }

        // --- Image Handling ---
        document.getElementById('adjustFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                selectedImageData = event.target.result;
                const imgEl = document.getElementById('adjustImg');
                imgEl.src = selectedImageData;
                imgEl.classList.remove('hidden');
                document.getElementById('adjustPlaceholder').classList.add('hidden');
                lucide.createIcons();
            };
            reader.readAsDataURL(file);
        });

        function changeAdjustQty(val) {
            const el = document.getElementById('adjustQty');
            el.value = Math.max(0, parseInt(el.value) + val);
        }

        // --- Save Logic (Mantendo a Correção solicitada) ---
        document.getElementById('saveAdjustBtn').addEventListener('click', function() {
            const name = document.getElementById('adjustName').value.trim();
            const qty = parseInt(document.getElementById('adjustQty').value);
            
            if (!name) {
                showFeedback("Insira o nome do produto", true);
                return;
            }

            const oldItem = inventory[currentBarcode];
            const oldQty = oldItem ? oldItem.qty : 0;
            const oldImage = oldItem ? oldItem.image : null;

            // Lógica fundamental: qualquer mudança (foto ou qtd) deve salvar
            const imageChanged = selectedImageData !== oldImage;
            const qtyChanged = qty !== oldQty;
            const nameChanged = oldItem && name !== oldItem.name;

            if (imageChanged || qtyChanged || nameChanged || !oldItem) {
                // Atualiza Item
                inventory[currentBarcode] = {
                    name: name,
                    qty: qty,
                    image: selectedImageData,
                    lastUpdate: new Date().toISOString()
                };

                // Define o tipo de ação para o histórico
                let actionType = "";
                if (!oldItem) actionType = "Novo Cadastro";
                else if (qtyChanged && imageChanged) actionType = "Ajuste de Foto e Qtd";
                else if (qtyChanged) actionType = qty > oldQty ? "Entrada" : "Saída";
                else if (imageChanged) actionType = "Alteração de Foto";
                else if (nameChanged) actionType = "Alteração de Nome";

                // Registra Movimentação
                historyLog.unshift({
                    barcode: currentBarcode,
                    name: name,
                    action: actionType,
                    diff: qtyChanged ? (qty - oldQty) : 0,
                    date: new Date().toLocaleString()
                });

                saveToStorage();
                showFeedback("Alterações salvas!");
                document.getElementById('adjustForm').classList.add('hidden');
                switchTab('view-inventory');
            } else {
                showFeedback("Sem alterações para salvar", true);
            }
        });

        // --- Render Lists ---
        function renderInventory() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = "";
            const searchTerm = document.getElementById('searchInventory').value.toLowerCase();

            Object.keys(inventory).forEach(code => {
                const item = inventory[code];
                if (item.name.toLowerCase().includes(searchTerm) || code.includes(searchTerm)) {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4 hover:shadow-md transition cursor-pointer";
                    card.onclick = () => onScanSuccess(code);
                    card.innerHTML = `
                        <div class="w-16 h-16 bg-gray-50 rounded-xl overflow-hidden flex-shrink-0 border border-gray-100">
                            ${item.image ? `<img src="${item.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-gray-300"><i data-lucide="image"></i></div>`}
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold truncate text-gray-800">${item.name}</h3>
                            <p class="text-[10px] text-gray-400 font-mono tracking-tighter">${code}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-gray-400 uppercase block mb-1">Qtd</span>
                            <span class="px-3 py-1 rounded-lg text-sm font-black ${item.qty > 0 ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}">
                                ${item.qty}
                            </span>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });
            lucide.createIcons();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = "";
            
            historyLog.slice(0, 50).forEach(log => {
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl shadow-sm border-l-4 " + 
                    (log.action.includes("Entrada") || log.action === "Novo Cadastro" ? "border-green-500" : 
                    log.action.includes("Foto") || log.action.includes("Nome") ? "border-blue-400" : "border-red-400");
                
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-bold text-gray-800">${log.name}</p>
                            <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">${log.action} • ${log.date}</p>
                        </div>
                        <div class="text-right">
                             <span class="text-sm font-black ${log.diff > 0 ? 'text-green-500' : log.diff < 0 ? 'text-red-500' : 'text-blue-500'}">
                                ${log.diff > 0 ? '+' : ''}${log.diff !== 0 ? log.diff : 'OK'}
                            </span>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- Init ---
        window.onload = () => {
            renderInventory();
            renderHistory();
            document.getElementById('searchInventory').oninput = renderInventory;
            lucide.createIcons();
        };

    </script>
</body>
</html>
