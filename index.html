<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Estoque - Gestão Dinâmica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pink': '#e91e63',
                        'soft-pink': '#f8bbd0',
                        'light-bg': '#f5f5f5',
                        'dark-text': '#262626',
                        'success-green': '#10b981',
                        'danger-red': '#ef4444',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        html, body { height: 100%; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        body { background-color: #f5f5f5; color: #262626; }
        
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .pop-plus { animation: popPlus 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .pop-minus { animation: popMinus 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes popPlus {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); color: #10b981; }
            100% { transform: scale(1); }
        }

        @keyframes popMinus {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); color: #ef4444; }
            100% { transform: scale(1); }
        }

        #qr-preview-modal, #modal-tags {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .preview-card {
            background: white;
            padding: 30px;
            border-radius: 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Modal QR Code -->
    <div id="qr-preview-modal">
        <div class="preview-card">
            <div id="label-to-print" class="bg-white p-4">
                <p style="font-size: 10px; color: #999; font-weight: bold; letter-spacing: 2px; margin-bottom: 4px; font-family: sans-serif;">MEU ESTOQUE PRO</p>
                <h2 id="print-name" style="font-size: 22px; font-weight: 900; margin-bottom: 15px; color: #000; text-transform: uppercase; line-height: 1.1; font-family: sans-serif;"></h2>
                <div id="print-qrcode-wrapper" style="display: flex; justify-content: center; margin: 15px 0;"></div>
                <p style="font-size: 10px; color: #999; margin-top: 10px; font-weight: bold; font-family: sans-serif;">CÓDIGO ÚNICO</p>
                <p id="print-id" style="font-size: 18px; font-weight: 900; color: #e91e63; font-family: monospace; letter-spacing: 2px; margin-top: 2px;"></p>
            </div>
            <div class="mt-8 flex flex-col gap-3">
                <button onclick="executePrint()" class="w-full bg-primary-pink text-white py-4 rounded-2xl font-black text-sm shadow-lg active:scale-95 transition">IMPRIMIR AGORA</button>
                <button onclick="document.getElementById('qr-preview-modal').style.display='none'" class="w-full bg-gray-100 text-gray-500 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest">CANCELAR</button>
            </div>
        </div>
    </div>

    <!-- Modal Gestão de Tags -->
    <div id="modal-tags" class="flex">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-8 fade-in">
            <h3 class="text-lg font-black text-gray-800 mb-4 uppercase tracking-tighter">Gerenciar Tags</h3>
            <div class="flex gap-2 mb-6">
                <input type="text" id="new-tag-input" placeholder="Nova tag..." class="flex-grow bg-gray-50 border border-gray-100 rounded-xl px-4 py-2 outline-none focus:ring-2 focus:ring-primary-pink">
                <button onclick="addNewTag()" class="bg-primary-pink text-white p-2 rounded-xl"><i data-lucide="plus"></i></button>
            </div>
            <div id="tags-list-container" class="space-y-2 max-h-60 overflow-y-auto pr-2 mb-6">
                <!-- Tags listadas aqui -->
            </div>
            <button onclick="document.getElementById('modal-tags').style.display='none'" class="w-full bg-gray-100 text-gray-500 py-4 rounded-2xl font-bold uppercase text-xs tracking-widest">Fechar</button>
        </div>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="p-4 flex justify-between items-center max-w-4xl mx-auto">
            <h1 class="text-2xl font-black text-primary-pink flex items-center tracking-tighter">
                <i data-lucide="package" class="mr-2"></i> MEU ESTOQUE
            </h1>
            <button onclick="filterLowStock()" class="relative p-2">
                <i data-lucide="bell" class="w-6 h-6 text-gray-400"></i>
                <span id="alert-badge" class="hidden absolute top-0 right-0 bg-red-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full space-y-6">
        <!-- Atalhos -->
        <section class="grid grid-cols-4 gap-3">
            <button onclick="openAiModal()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-100 hover:bg-pink-50 active:scale-90 transition">
                <div class="p-3 bg-pink-100 rounded-full mb-1 text-primary-pink"><i data-lucide="camera" class="w-6 h-6"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">FOTO</span>
            </button>
            <button onclick="filterLowStock()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-100 hover:bg-red-50 active:scale-90 transition">
                <div class="p-3 bg-red-100 rounded-full mb-1 text-red-600"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">ALERTA</span>
            </button>
            <button onclick="openTagsManager()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-100 hover:bg-orange-50 active:scale-90 transition">
                <div class="p-3 bg-orange-100 rounded-full mb-1 text-orange-600"><i data-lucide="tag" class="w-6 h-6"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">TAGS</span>
            </button>
            <button onclick="renderInventory()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-100 hover:bg-gray-50 active:scale-90 transition">
                <div class="p-3 bg-gray-100 rounded-full mb-1 text-gray-600"><i data-lucide="list" class="w-6 h-6"></i></div>
                <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">TODOS</span>
            </button>
        </section>

        <!-- Filtro de Categorias (Tags) -->
        <div id="category-chips" class="flex gap-2 overflow-x-auto hide-scroll py-1">
            <!-- Chips gerados via JS -->
        </div>

        <!-- Cadastro -->
        <section class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-gray-100">
            <h2 class="text-xs font-black mb-4 flex items-center uppercase tracking-[0.2em] text-gray-400">
                <i data-lucide="plus" class="mr-2 w-4 h-4 text-primary-pink"></i> Novo Registro
            </h2>
            <div class="space-y-4">
                <div class="flex flex-col items-center">
                    <div id="image-placeholder" onclick="document.getElementById('file-input').click()" class="w-24 h-24 bg-gray-50 border-2 border-dashed border-gray-200 rounded-3xl flex flex-col items-center justify-center cursor-pointer hover:border-primary-pink transition">
                        <i data-lucide="image-plus" class="w-6 h-6 text-gray-300 mb-1"></i>
                        <span class="text-[8px] text-gray-400 font-bold uppercase tracking-widest">Foto</span>
                    </div>
                    <div id="image-preview-container" class="hidden relative w-24 h-24">
                        <img id="image-preview" src="" class="w-full h-full object-cover rounded-3xl border-2 border-primary-pink">
                        <button onclick="clearImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-lg"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>
                    <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="prod-name" placeholder="Nome do produto" class="bg-gray-50 border border-gray-100 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-primary-pink">
                    <select id="prod-category" class="bg-gray-50 border border-gray-100 rounded-2xl p-4 outline-none"></select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Qtd.</label>
                        <input type="number" id="prod-qty" value="1" min="0" class="w-full bg-gray-50 border border-gray-100 rounded-2xl p-4 outline-none font-bold">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Alerta</label>
                        <input type="number" id="prod-alert" value="2" min="0" class="w-full bg-gray-50 border border-gray-100 rounded-2xl p-4 outline-none font-bold">
                    </div>
                </div>
                
                <button onclick="saveProduct()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg active:scale-95 transition tracking-widest uppercase text-sm">
                    CADASTRAR PRODUTO
                </button>
            </div>
        </section>

        <!-- Busca -->
        <div class="relative">
            <input type="text" id="global-search" placeholder="Buscar por nome ou ID..." class="w-full bg-white border-none shadow-sm rounded-2xl p-4 pl-12 outline-none focus:ring-2 focus:ring-primary-pink transition">
            <i data-lucide="search" class="absolute left-4 top-4 text-gray-300 w-5 h-5"></i>
        </div>

        <div id="inventory-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 pb-10"></div>
    </main>

    <!-- Modal Edição -->
    <div id="modal-edit" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-lg p-8 fade-in shadow-2xl overflow-y-auto max-h-[95vh]">
            <div class="flex justify-between items-start mb-6">
                <button id="btn-delete" class="p-3 bg-red-50 text-red-500 rounded-2xl hover:bg-red-500 hover:text-white transition">
                    <i data-lucide="trash-2" class="w-6 h-6"></i>
                </button>
                <div class="relative group cursor-pointer" onclick="triggerUpdatePhoto()">
                    <img id="edit-img" class="w-32 h-32 rounded-[2rem] object-cover shadow-xl border-4 border-white ring-1 ring-gray-100">
                    <div class="absolute inset-0 bg-black/40 rounded-[2rem] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <i data-lucide="camera" class="text-white"></i>
                    </div>
                    <input type="file" id="edit-file-input" accept="image/*" class="hidden" onchange="handleUpdatePhoto(event)">
                </div>
                <button onclick="prepareQRPreview()" class="p-3 bg-gray-100 text-gray-700 rounded-2xl hover:bg-primary-pink hover:text-white transition">
                    <i data-lucide="printer" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-3 mb-8 text-center">
                <span id="display-id" class="text-[10px] font-mono text-gray-300 bg-gray-100 px-3 py-1 rounded-full uppercase tracking-widest"></span>
                <div class="bg-gray-50 p-4 rounded-[1.5rem] border border-gray-100 text-left">
                    <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1 mb-1 block">Nome do Produto</label>
                    <input type="text" id="edit-name-input" class="w-full bg-transparent border-none p-0 font-bold text-lg outline-none text-gray-700">
                </div>
                <div class="grid grid-cols-2 gap-3 text-left">
                    <div class="bg-gray-50 p-4 rounded-[1.5rem] border border-gray-100">
                        <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1 mb-1 block">Categoria</label>
                        <select id="edit-cat-select" class="w-full bg-transparent border-none p-0 font-bold outline-none text-gray-700"></select>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-[1.5rem] border border-gray-100">
                        <label class="text-[9px] font-black text-gray-400 uppercase tracking-widest ml-1 mb-1 block">Alerta</label>
                        <input type="number" id="edit-alert-input" class="w-full bg-transparent border-none p-0 font-bold outline-none text-gray-700">
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-6 rounded-[2.5rem] border border-gray-100 mb-8 text-center">
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Estoque Atual</span>
                <div id="edit-qty-display" class="text-6xl font-black text-primary-pink mb-4 transition-all duration-300">0</div>
                <div class="flex items-center gap-3 bg-white p-2 rounded-3xl shadow-inner border">
                    <button onclick="adjustTempByValue(-1)" class="w-14 h-14 flex items-center justify-center bg-danger-red text-white rounded-2xl active:scale-90 transition shadow-md"><i data-lucide="minus"></i></button>
                    <input type="number" id="step-value" value="1" class="flex-grow text-center text-2xl font-black text-gray-700 outline-none bg-transparent">
                    <button onclick="adjustTempByValue(1)" class="w-14 h-14 flex items-center justify-center bg-success-green text-white rounded-2xl active:scale-90 transition shadow-md"><i data-lucide="plus"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeEditModal()" class="w-full bg-gray-100 text-gray-400 font-black py-5 rounded-[1.5rem] uppercase text-xs tracking-widest">Sair</button>
                <button onclick="saveEditChanges()" class="w-full bg-primary-pink text-white font-black py-5 rounded-[1.5rem] shadow-xl uppercase text-xs tracking-widest">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal Câmara -->
    <div id="modal-ai" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-6 overflow-hidden text-center">
            <h3 class="font-black mb-4 uppercase text-gray-400">Capturar Foto</h3>
            <div class="relative bg-black rounded-3xl overflow-hidden aspect-square mb-6">
                <video id="ai-video" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <button onclick="captureFromAi()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl mb-2">FOTOGRAFAR</button>
            <button onclick="closeAiModal()" class="w-full bg-gray-100 text-gray-500 font-bold py-3 rounded-2xl uppercase text-xs">FECHAR</button>
        </div>
    </div>

    <script>
        let products = [];
        const DB_KEY = 'stock_pro_master_db_v3';
        let categories = JSON.parse(localStorage.getItem('stock_pro_cats')) || ['Geral', 'Cozinha', 'Higiene', 'Despensa'];
        let selectedProduct = null;
        let currentPhoto = null;
        let tempQty = 0;
        let activeFilterTag = "TODOS";

        const loadProducts = () => {
            const stored = localStorage.getItem(DB_KEY);
            products = stored ? JSON.parse(stored) : [];
        };

        window.onload = () => {
            loadProducts();
            lucide.createIcons();
            renderCategories();
            renderInventory();
            initDeleteHandler();
        };

        function saveDb() {
            localStorage.setItem(DB_KEY, JSON.stringify(products));
            updateBadge();
        }

        function updateBadge() {
            const lowCount = products.filter(p => p.qty <= (p.alert || 0)).length;
            const b = document.getElementById('alert-badge');
            if(b) {
                b.innerText = lowCount;
                lowCount > 0 ? b.classList.remove('hidden') : b.classList.add('hidden');
            }
        }

        function filterLowStock() {
            activeFilterTag = null;
            renderCategoryChips();
            const low = products.filter(p => p.qty <= (p.alert || 0));
            renderSpecificList(low);
        }

        function renderCategories() {
            const selects = [document.getElementById('prod-category'), document.getElementById('edit-cat-select')];
            selects.forEach(s => {
                if (s) s.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            });
            localStorage.setItem('stock_pro_cats', JSON.stringify(categories));
            renderCategoryChips();
            renderTagsList();
        }

        // --- GESTÃO DE TAGS (MODAL NOVO) ---
        function openTagsManager() {
            document.getElementById('modal-tags').style.display = 'flex';
            renderTagsList();
        }

        function renderTagsList() {
            const container = document.getElementById('tags-list-container');
            container.innerHTML = categories.map(cat => `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <span class="text-xs font-bold text-gray-700 uppercase">${cat}</span>
                    <button onclick="deleteTag('${cat}')" class="text-red-400 hover:text-red-600"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addNewTag() {
            const input = document.getElementById('new-tag-input');
            const val = input.value.trim();
            if(val && !categories.includes(val)) {
                categories.push(val);
                input.value = "";
                renderCategories();
            }
        }

        function deleteTag(cat) {
            if(categories.length <= 1) return; // Manter pelo menos uma
            categories = categories.filter(c => c !== cat);
            renderCategories();
        }

        // --- FILTROS E LISTAGEM ---
        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            const allCats = ["TODOS", ...categories];
            container.innerHTML = allCats.map(cat => {
                const isActive = activeFilterTag === cat;
                return `
                    <button onclick="filterByCategory('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest transition shadow-sm border ${isActive ? 'bg-primary-pink text-white border-primary-pink' : 'bg-white text-gray-400 border-gray-100 hover:bg-gray-50'}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function filterByCategory(cat) {
            activeFilterTag = cat;
            renderCategoryChips();
            if (cat === "TODOS") {
                renderInventory();
            } else {
                const filtered = products.filter(p => p.category === cat);
                renderSpecificList(filtered);
            }
        }

        function renderInventory(filter = "") {
            const term = filter.toLowerCase().trim();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term) || p.id.toLowerCase() === term);
            renderSpecificList(filtered);
            updateBadge();
        }

        function renderSpecificList(listToRender) {
            const list = document.getElementById('inventory-list');
            if(listToRender.length === 0) {
                list.innerHTML = `<div class="col-span-full py-20 text-center text-gray-300 font-bold uppercase text-[10px] tracking-widest">Sem itens encontrados</div>`;
                return;
            }
            list.innerHTML = listToRender.map(p => {
                const isLow = p.qty <= (p.alert || 0);
                return `
                <div onclick="openEditModal('${p.id}')" class="fade-in bg-white p-5 rounded-[2rem] shadow-sm border ${isLow ? 'border-red-100 ring-4 ring-red-50' : 'border-gray-50'} flex items-center gap-4 cursor-pointer active:scale-95 transition">
                    <div class="w-16 h-16 bg-gray-50 rounded-2xl overflow-hidden shrink-0">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-grow overflow-hidden text-left">
                        <h4 class="font-black text-gray-800 uppercase text-[11px] truncate">${p.name}</h4>
                        <span class="text-[9px] font-bold text-gray-300 uppercase tracking-widest">${p.category || 'Geral'}</span>
                    </div>
                    <div class="text-right">
                        <div class="text-2xl font-black ${isLow ? 'text-red-500' : 'text-primary-pink'}">${p.qty}</div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        async function saveProduct() {
            const name = document.getElementById('prod-name').value.trim();
            if(!name) return;
            const shortId = Math.random().toString(36).substr(2, 6).toUpperCase();
            products.unshift({
                id: shortId,
                name,
                category: document.getElementById('prod-category').value,
                qty: parseInt(document.getElementById('prod-qty').value) || 0,
                alert: parseInt(document.getElementById('prod-alert').value) || 0,
                image: currentPhoto
            });
            saveDb();
            document.getElementById('prod-name').value = ""; clearImage(); renderInventory();
        }

        function openEditModal(id) {
            selectedProduct = products.find(item => item.id === id);
            tempQty = selectedProduct.qty;
            document.getElementById('display-id').innerText = `Cód: ${selectedProduct.id}`;
            document.getElementById('edit-name-input').value = selectedProduct.name;
            document.getElementById('edit-cat-select').value = selectedProduct.category;
            document.getElementById('edit-alert-input').value = selectedProduct.alert || 0;
            document.getElementById('edit-qty-display').innerText = tempQty;
            document.getElementById('edit-img').src = selectedProduct.image || 'https://via.placeholder.com/150';
            resetDeleteButton();
            document.getElementById('modal-edit').classList.remove('hidden');
        }

        function adjustTempByValue(direction) {
            const step = parseInt(document.getElementById('step-value').value) || 1;
            const display = document.getElementById('edit-qty-display');
            tempQty = Math.max(0, tempQty + (direction * step));
            display.classList.remove('pop-plus', 'pop-minus');
            void display.offsetWidth;
            display.innerText = tempQty;
            direction > 0 ? display.classList.add('pop-plus') : display.classList.add('pop-minus');
        }

        function closeEditModal() { document.getElementById('modal-edit').classList.add('hidden'); }

        function saveEditChanges() {
            const idx = products.findIndex(p => p.id === selectedProduct.id);
            if(idx !== -1) {
                products[idx].name = document.getElementById('edit-name-input').value;
                products[idx].category = document.getElementById('edit-cat-select').value;
                products[idx].alert = parseInt(document.getElementById('edit-alert-input').value) || 0;
                products[idx].qty = tempQty;
                saveDb(); renderInventory();
            }
            closeEditModal();
        }

        function initDeleteHandler() {
            const btn = document.getElementById('btn-delete');
            btn.onclick = () => {
                if (btn.getAttribute('data-confirm') !== 'true') {
                    btn.setAttribute('data-confirm', 'true');
                    btn.innerHTML = '<i data-lucide="check" class="w-6 h-6"></i>';
                    btn.className = "p-3 bg-red-600 text-white rounded-2xl transition";
                    lucide.createIcons();
                    setTimeout(resetDeleteButton, 3000);
                } else {
                    products = products.filter(p => p.id !== selectedProduct.id);
                    saveDb(); closeEditModal(); renderInventory();
                }
            };
        }

        function resetDeleteButton() {
            const btn = document.getElementById('btn-delete');
            if(!btn) return;
            btn.setAttribute('data-confirm', 'false');
            btn.className = "p-3 bg-red-50 text-red-500 rounded-2xl transition";
            btn.innerHTML = '<i data-lucide="trash-2" class="w-6 h-6"></i>';
            lucide.createIcons();
        }

        function handleFileUpload(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = async (ev) => { currentPhoto = await compressImage(ev.target.result); showImagePreview(); };
            r.readAsDataURL(f);
        }

        function showImagePreview() {
            document.getElementById('image-placeholder').classList.add('hidden');
            document.getElementById('image-preview').src = currentPhoto;
            document.getElementById('image-preview-container').classList.remove('hidden');
        }

        function clearImage() {
            currentPhoto = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-placeholder').classList.remove('hidden');
        }

        function triggerUpdatePhoto() { document.getElementById('edit-file-input').click(); }
        async function handleUpdatePhoto(e) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = async (ev) => {
                const img = await compressImage(ev.target.result);
                selectedProduct.image = img;
                document.getElementById('edit-img').src = img;
                saveDb();
            };
            r.readAsDataURL(f);
        }

        async function openAiModal() {
            const v = document.getElementById('ai-video');
            document.getElementById('modal-ai').classList.remove('hidden');
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                v.srcObject = s;
            } catch (err) { alert("Câmara não encontrada"); }
        }

        async function captureFromAi() {
            const v = document.getElementById('ai-video');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const compressed = await compressImage(c.toDataURL('image/webp', 0.6));
            if (selectedProduct) {
                selectedProduct.image = compressed;
                document.getElementById('edit-img').src = compressed;
                saveDb();
            } else {
                currentPhoto = compressed;
                showImagePreview();
            }
            closeAiModal();
        }

        function closeAiModal() {
            const v = document.getElementById('ai-video');
            if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('modal-ai').classList.add('hidden');
        }

        function compressImage(base64Str, maxWidth = 400, quality = 0.6) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/webp', quality));
                };
            });
        }

        function prepareQRPreview() {
            if (!selectedProduct) return;
            const modal = document.getElementById('qr-preview-modal');
            const qrWrapper = document.getElementById('print-qrcode-wrapper');
            qrWrapper.innerHTML = "";
            document.getElementById('print-name').innerText = selectedProduct.name;
            document.getElementById('print-id').innerText = selectedProduct.id;
            modal.style.display = 'flex';
            new QRCode(qrWrapper, { text: selectedProduct.id, width: 180, height: 180 });
        }

        function executePrint() {
            const content = document.getElementById('label-to-print').innerHTML;
            const pw = window.open('', '_blank', 'width=600,height=600');
            pw.document.write(`<html><body style="text-align:center;padding:20px;">${content}<script>window.onload=function(){window.print();window.close();}<\/script></body></html>`);
            pw.document.close();
        }

        document.getElementById('global-search').addEventListener('input', (e) => renderInventory(e.target.value));
    </script>
</body>
</html>
