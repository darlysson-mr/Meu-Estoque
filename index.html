<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Estoque - Gestão Dinâmica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-pink': '#e91e63',
                        'soft-pink': '#f8bbd0',
                        'light-bg': '#f5f5f5',
                        'dark-text': '#262626',
                        'success-green': '#10b981',
                        'danger-red': '#ef4444',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f5f5f5; 
            color: #262626;
            overflow-x: hidden;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
        }
        
        .fade-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 5000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        #qr-preview-modal { z-index: 6000; }

        .preview-card {
            background: white;
            padding: 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #label-preview-content {
            background: white;
            border: 2px dashed #eee;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        input, select { font-size: 16px !important; }
        
        .touch-btn {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .touch-btn:active { transform: scale(0.96); opacity: 0.9; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-10">

    <!-- Modal de Impressão de Etiqueta -->
    <div id="qr-preview-modal" class="modal-overlay">
        <div class="preview-card fade-in">
            <div id="label-preview-content">
                <p style="font-size: 10px; color: #e91e63; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; font-family: sans-serif; text-transform: uppercase;">Estoque Pro</p>
                <h2 id="print-name" style="font-size: 18px; font-weight: 900; margin-bottom: 12px; color: #000; text-transform: uppercase; font-family: sans-serif; line-height: 1.2;">NOME DO PRODUTO</h2>
                <div id="print-qrcode-wrapper" style="display: flex; justify-content: center; margin: 15px auto; padding: 10px; background: white; min-height: 180px; align-items: center;">
                    <!-- QR Code será gerado aqui -->
                </div>
                <p id="print-id" style="font-size: 14px; font-weight: 900; color: #000; font-family: monospace; letter-spacing: 1px;">ID: 000000</p>
            </div>
            <div class="space-y-3">
                <button onclick="executePrint()" class="w-full bg-primary-pink text-white py-4 rounded-2xl font-black text-sm shadow-xl flex items-center justify-center gap-2 uppercase tracking-widest touch-btn">
                    <i data-lucide="printer" class="w-5 h-5"></i> Imprimir / Salvar PDF
                </button>
                <button onclick="closeQrModal()" class="w-full text-gray-400 py-2 font-bold text-[11px] uppercase tracking-widest">Sair</button>
            </div>
        </div>
    </div>

    <!-- Modal Tags -->
    <div id="modal-tags" class="modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-6 fade-in shadow-2xl">
            <h3 class="text-sm font-black text-gray-800 mb-4 uppercase tracking-widest">Categorias</h3>
            <div class="flex gap-2 mb-4">
                <input type="text" id="new-tag-input" placeholder="Nova..." class="flex-grow bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-primary-pink">
                <button onclick="addNewTag()" class="bg-primary-pink text-white px-4 rounded-xl shadow-md touch-btn"><i data-lucide="plus"></i></button>
            </div>
            <div id="tags-list-container" class="space-y-2 max-h-48 overflow-y-auto pr-1 mb-6 hide-scroll"></div>
            <button onclick="closeTagsManager()" class="w-full bg-gray-100 text-gray-500 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest touch-btn">Voltar</button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40 w-full">
        <div class="px-4 py-4 flex justify-between items-center max-w-4xl mx-auto">
            <h1 class="text-xl font-black text-primary-pink flex items-center tracking-tighter">
                <i data-lucide="package" class="mr-2 w-5 h-5"></i> ESTOQUE
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="filterLowStock()" class="relative p-2 text-gray-400">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span id="alert-badge" class="hidden absolute top-0 right-0 bg-red-500 text-white text-[9px] rounded-full w-4 h-4 flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="openTagsManager()" class="p-2 text-gray-400"><i data-lucide="settings" class="w-6 h-6"></i></button>
            </div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-4xl mx-auto w-full space-y-4">
        <!-- Atalhos -->
        <section class="grid grid-cols-4 gap-2">
            <button onclick="openAiModal()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-pink-50 transition">
                <div class="p-2 bg-pink-100 rounded-full mb-1 text-primary-pink"><i data-lucide="camera" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Foto</span>
            </button>
            <button onclick="filterLowStock()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-red-50 transition">
                <div class="p-2 bg-red-100 rounded-full mb-1 text-red-600"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Alerta</span>
            </button>
            <button onclick="openTagsManager()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-orange-50 transition">
                <div class="p-2 bg-orange-100 rounded-full mb-1 text-orange-600"><i data-lucide="tag" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Tags</span>
            </button>
            <button onclick="renderInventory()" class="flex flex-col items-center p-3 bg-white rounded-2xl shadow-sm border border-gray-50 active:bg-gray-50 transition">
                <div class="p-2 bg-gray-100 rounded-full mb-1 text-gray-600"><i data-lucide="list" class="w-5 h-5"></i></div>
                <span class="text-[8px] font-black text-gray-400 uppercase">Todos</span>
            </button>
        </section>

        <!-- Cadastro -->
        <section class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 w-full overflow-hidden">
            <h2 class="text-[10px] font-black mb-4 flex items-center uppercase tracking-widest text-gray-400">
                <i data-lucide="plus-circle" class="mr-2 w-4 h-4 text-primary-pink"></i> Novo Item
            </h2>
            <div class="space-y-4">
                <div class="flex items-center gap-4">
                    <div id="image-placeholder" onclick="triggerFileInput('main')" class="w-20 h-20 bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center shrink-0 cursor-pointer">
                        <i data-lucide="image-plus" class="w-6 h-6 text-gray-300"></i>
                    </div>
                    <div id="image-preview-container" class="hidden relative w-20 h-20 shrink-0">
                        <img id="image-preview" src="" class="w-full h-full object-cover rounded-2xl">
                        <button onclick="clearImage()" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-1 shadow-lg"><i data-lucide="x" class="w-3 h-3"></i></button>
                    </div>
                    <div class="flex-grow">
                        <input type="text" id="prod-name" placeholder="Nome do produto..." class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none focus:ring-2 focus:ring-primary-pink mb-2">
                        <select id="prod-category" class="w-full bg-gray-50 border-none rounded-xl p-3 outline-none appearance-none"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 rounded-xl p-3">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Estoque</label>
                        <input type="number" id="prod-qty" value="1" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                    <div class="bg-gray-50 rounded-xl p-3">
                        <label class="text-[9px] font-black text-gray-400 uppercase">Mínimo</label>
                        <input type="number" id="prod-alert" value="2" class="w-full bg-transparent font-black text-lg outline-none">
                    </div>
                </div>
                <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'main')">
                <input type="file" id="edit-file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event, 'edit')">
                <button onclick="saveProduct()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg uppercase text-[12px] tracking-widest touch-btn">Cadastrar Item</button>
            </div>
        </section>

        <div id="category-chips" class="flex gap-2 overflow-x-auto hide-scroll py-1"></div>

        <div class="relative w-full">
            <input type="text" id="global-search" placeholder="Pesquisar estoque..." class="w-full bg-white border-none shadow-sm rounded-2xl p-4 pl-12 outline-none focus:ring-2 focus:ring-pink-100">
            <i data-lucide="search" class="absolute left-4 top-4 text-gray-300 w-5 h-5"></i>
        </div>

        <div id="inventory-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pb-24"></div>
    </main>

    <!-- Modal Edição -->
    <div id="modal-edit" class="modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-6 fade-in shadow-2xl max-h-[95vh] overflow-y-auto hide-scroll">
            <div class="flex justify-between items-center mb-6">
                <button id="btn-delete" class="p-3 bg-red-50 text-red-500 rounded-xl"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                <div class="relative">
                    <div onclick="triggerFileInput('edit')" class="w-24 h-24 rounded-3xl overflow-hidden shadow-lg border-2 border-white cursor-pointer bg-gray-100 flex items-center justify-center">
                        <img id="edit-img" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    </div>
                    <div class="absolute -bottom-1 -right-1 bg-primary-pink text-white p-2 rounded-full shadow-md">
                        <i data-lucide="camera" class="w-3 h-3"></i>
                    </div>
                </div>
                <button onclick="prepareQRPreview()" class="p-3 bg-pink-50 text-primary-pink rounded-xl"><i data-lucide="printer" class="w-5 h-5"></i></button>
            </div>

            <div class="space-y-3 mb-6">
                <div class="bg-gray-50 p-3 rounded-2xl">
                    <label class="text-[9px] font-black text-gray-300 uppercase tracking-widest">Produto</label>
                    <input type="text" id="edit-name-input" class="w-full bg-transparent border-none p-1 font-black text-gray-700 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-gray-50 p-3 rounded-2xl">
                        <label class="text-[9px] font-black text-gray-300 uppercase tracking-widest">Categoria</label>
                        <select id="edit-cat-select" class="w-full bg-transparent border-none p-1 font-bold text-xs outline-none"></select>
                    </div>
                    <div class="bg-gray-50 p-3 rounded-2xl">
                        <label class="text-[9px] font-black text-gray-300 uppercase tracking-widest">Mínimo</label>
                        <input type="number" id="edit-alert-input" class="w-full bg-transparent border-none p-1 font-black outline-none">
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-5 rounded-3xl text-center mb-6 border border-gray-100">
                <span class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Saldo Atual</span>
                <div id="edit-qty-display" class="text-6xl font-black text-primary-pink my-3">0</div>
                
                <div class="flex items-center gap-3">
                    <button onclick="adjustTempByValue(-1)" class="w-14 h-14 flex items-center justify-center bg-danger-red text-white rounded-2xl shadow-lg active:scale-90">
                        <i data-lucide="minus" class="w-6 h-6"></i>
                    </button>
                    <div class="flex-grow bg-white rounded-2xl p-2 shadow-inner border border-gray-100">
                        <label class="text-[8px] font-black text-gray-300 uppercase block mb-1">Passo</label>
                        <input type="number" id="step-value" value="1" class="w-full text-center text-2xl font-black bg-transparent outline-none">
                    </div>
                    <button onclick="adjustTempByValue(1)" class="w-14 h-14 flex items-center justify-center bg-success-green text-white rounded-2xl shadow-lg active:scale-90">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeEditModal()" class="w-full bg-gray-100 text-gray-400 font-black py-4 rounded-2xl uppercase text-[11px] touch-btn">Sair</button>
                <button onclick="saveEditChanges()" class="w-full bg-primary-pink text-white font-black py-4 rounded-2xl shadow-lg uppercase text-[11px] touch-btn">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal Câmera AI -->
    <div id="modal-ai" class="modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-4 text-center">
            <div class="bg-black rounded-[2rem] overflow-hidden aspect-square mb-4">
                <video id="ai-video" autoplay playsinline class="w-full h-full object-cover"></video>
            </div>
            <div class="flex gap-2">
                <button onclick="closeAiModal()" class="flex-grow bg-gray-100 py-4 rounded-xl font-bold text-gray-500 uppercase text-[10px] touch-btn">Cancelar</button>
                <button onclick="captureFromAi()" class="flex-[2] bg-primary-pink text-white py-4 rounded-xl font-black uppercase text-[10px] touch-btn">Captar Foto</button>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        const DB_KEY = 'stock_pro_master_db_v6';
        let categories = JSON.parse(localStorage.getItem('stock_pro_cats')) || ['Geral', 'Cozinha', 'Limpeza', 'Alimentos'];
        let selectedProduct = null;
        let currentPhoto = null;
        let tempQty = 0;
        let activeFilterTag = "TODOS";
        let colorResetTimeout = null;

        const loadProducts = () => {
            const stored = localStorage.getItem(DB_KEY);
            products = stored ? JSON.parse(stored) : [];
        };

        window.onload = () => {
            loadProducts();
            lucide.createIcons();
            renderCategories();
            renderInventory();
            initDeleteHandler();
        };

        function saveDb() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(products));
                updateBadge();
            } catch (e) {
                console.error("Storage full:", e);
            }
        }

        function updateBadge() {
            const lowCount = products.filter(p => p.qty <= (p.alert || 0)).length;
            const b = document.getElementById('alert-badge');
            if(b) {
                b.innerText = lowCount;
                lowCount > 0 ? b.classList.remove('hidden') : b.classList.add('hidden');
            }
        }

        function renderCategories() {
            const selects = [document.getElementById('prod-category'), document.getElementById('edit-cat-select')];
            selects.forEach(s => {
                if (s) s.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');
            });
            localStorage.setItem('stock_pro_cats', JSON.stringify(categories));
            renderCategoryChips();
        }

        function openTagsManager() {
            document.getElementById('modal-tags').style.display = 'flex';
            renderTagsList();
        }
        function closeTagsManager() { document.getElementById('modal-tags').style.display = 'none'; }

        function renderTagsList() {
            const container = document.getElementById('tags-list-container');
            container.innerHTML = categories.map(cat => `
                <div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl">
                    <span class="text-[10px] font-black text-gray-600 uppercase">${cat}</span>
                    <button onclick="deleteTag('${cat}')" class="text-red-300 p-2"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addNewTag() {
            const input = document.getElementById('new-tag-input');
            const val = input.value.trim();
            if(val && !categories.includes(val)) {
                categories.push(val);
                input.value = "";
                renderCategories();
                renderTagsList();
            }
        }

        function deleteTag(cat) {
            if(categories.length <= 1) return;
            categories = categories.filter(c => c !== cat);
            renderCategories();
            renderTagsList();
        }

        function renderCategoryChips() {
            const container = document.getElementById('category-chips');
            const allCats = ["TODOS", ...categories];
            container.innerHTML = allCats.map(cat => {
                const isActive = activeFilterTag === cat;
                return `
                    <button onclick="filterByCategory('${cat}')" class="whitespace-nowrap px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-widest transition border ${isActive ? 'bg-primary-pink text-white border-primary-pink shadow-md' : 'bg-white text-gray-400 border-gray-100'}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function filterByCategory(cat) {
            activeFilterTag = cat;
            renderCategoryChips();
            if (cat === "TODOS") renderInventory();
            else renderSpecificList(products.filter(p => p.category === cat));
        }

        function renderInventory(filter = "") {
            const term = filter.toLowerCase().trim();
            const filtered = products.filter(p => p.name.toLowerCase().includes(term) || p.id.toLowerCase() === term);
            renderSpecificList(filtered);
            updateBadge();
        }

        function renderSpecificList(listToRender) {
            const list = document.getElementById('inventory-list');
            if(listToRender.length === 0) {
                list.innerHTML = `<div class="col-span-full py-10 text-center text-gray-300 font-bold uppercase text-[10px] tracking-widest">Nenhum item</div>`;
                return;
            }
            list.innerHTML = listToRender.map(p => {
                const isLow = p.qty <= (p.alert || 0);
                return `
                <div onclick="openEditModal('${p.id}')" class="fade-in bg-white p-4 rounded-3xl shadow-sm border ${isLow ? 'border-red-200 bg-red-50/30' : 'border-gray-50'} flex items-center gap-4 active:scale-95 transition cursor-pointer">
                    <div class="w-14 h-14 bg-gray-100 rounded-2xl overflow-hidden shrink-0 border border-gray-50">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-grow overflow-hidden">
                        <h4 class="font-black text-gray-800 uppercase text-[11px] truncate">${p.name}</h4>
                        <span class="text-[9px] font-bold text-gray-300 uppercase">${p.category}</span>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-2xl font-black ${isLow ? 'text-red-600' : 'text-primary-pink'}">${p.qty}</div>
                    </div>
                </div>`;
            }).join('');
            lucide.createIcons();
        }

        function adjustTempByValue(direction) {
            const display = document.getElementById('edit-qty-display');
            const step = parseInt(document.getElementById('step-value').value) || 1;
            tempQty = Math.max(0, tempQty + (direction * step));
            display.innerText = tempQty;
            if (colorResetTimeout) clearTimeout(colorResetTimeout);
            display.style.color = direction > 0 ? '#10b981' : '#ef4444';
            colorResetTimeout = setTimeout(() => { display.style.color = '#e91e63'; }, 400);
        }

        async function saveProduct() {
            const nameEl = document.getElementById('prod-name');
            const name = nameEl.value.trim();
            if(!name) return;
            const shortId = Math.random().toString(36).substr(2, 6).toUpperCase();
            products.unshift({
                id: shortId,
                name,
                category: document.getElementById('prod-category').value,
                qty: parseInt(document.getElementById('prod-qty').value) || 0,
                alert: parseInt(document.getElementById('prod-alert').value) || 0,
                image: currentPhoto
            });
            saveDb();
            nameEl.value = ""; 
            clearImage(); 
            renderInventory();
        }

        function openEditModal(id) {
            selectedProduct = products.find(item => item.id === id);
            tempQty = selectedProduct.qty;
            document.getElementById('edit-name-input').value = selectedProduct.name;
            document.getElementById('edit-cat-select').value = selectedProduct.category;
            document.getElementById('edit-alert-input').value = selectedProduct.alert || 0;
            document.getElementById('edit-qty-display').innerText = tempQty;
            document.getElementById('edit-img').src = selectedProduct.image || 'https://via.placeholder.com/150';
            resetDeleteButton();
            document.getElementById('modal-edit').style.display = 'flex';
            lucide.createIcons();
        }

        function closeEditModal() { document.getElementById('modal-edit').style.display = 'none'; }

        function saveEditChanges() {
            const idx = products.findIndex(p => p.id === selectedProduct.id);
            if(idx !== -1) {
                products[idx].name = document.getElementById('edit-name-input').value;
                products[idx].category = document.getElementById('edit-cat-select').value;
                products[idx].alert = parseInt(document.getElementById('edit-alert-input').value) || 0;
                products[idx].qty = tempQty;
                saveDb(); renderInventory();
            }
            closeEditModal();
        }

        function initDeleteHandler() {
            const btn = document.getElementById('btn-delete');
            btn.onclick = () => {
                if (btn.getAttribute('data-confirm') !== 'true') {
                    btn.setAttribute('data-confirm', 'true');
                    btn.innerHTML = '<i data-lucide="check"></i>';
                    btn.className = "p-3 bg-red-600 text-white rounded-xl";
                    lucide.createIcons();
                    setTimeout(resetDeleteButton, 3000);
                } else {
                    products = products.filter(p => p.id !== selectedProduct.id);
                    saveDb(); closeEditModal(); renderInventory();
                }
            };
        }

        function resetDeleteButton() {
            const btn = document.getElementById('btn-delete');
            if(!btn) return;
            btn.setAttribute('data-confirm', 'false');
            btn.className = "p-3 bg-red-50 text-red-500 rounded-xl";
            btn.innerHTML = '<i data-lucide="trash-2"></i>';
            lucide.createIcons();
        }

        function triggerFileInput(mode) {
            if (mode === 'main') document.getElementById('file-input').click();
            else document.getElementById('edit-file-input').click();
        }

        function handleFileUpload(e, mode) {
            const f = e.target.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = async (ev) => { 
                const compressed = await compressImage(ev.target.result); 
                if (mode === 'main') {
                    currentPhoto = compressed;
                    showImagePreview();
                } else {
                    selectedProduct.image = compressed;
                    document.getElementById('edit-img').src = compressed;
                }
            };
            r.readAsDataURL(f);
        }

        function showImagePreview() {
            document.getElementById('image-placeholder').classList.add('hidden');
            document.getElementById('image-preview').src = currentPhoto;
            document.getElementById('image-preview-container').classList.remove('hidden');
        }

        function clearImage() {
            currentPhoto = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('image-placeholder').classList.remove('hidden');
        }

        async function openAiModal() {
            const v = document.getElementById('ai-video');
            document.getElementById('modal-ai').style.display = 'flex';
            try {
                const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                v.srcObject = s;
            } catch (err) { alert("Câmara inacessível"); }
        }

        async function captureFromAi() {
            const v = document.getElementById('ai-video');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const compressed = await compressImage(c.toDataURL('image/webp', 0.6));
            if (document.getElementById('modal-edit').style.display === 'flex') {
                selectedProduct.image = compressed;
                document.getElementById('edit-img').src = compressed;
            } else {
                currentPhoto = compressed;
                showImagePreview();
            }
            closeAiModal();
        }

        function closeAiModal() {
            const v = document.getElementById('ai-video');
            if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('modal-ai').style.display = 'none';
        }

        function compressImage(base64Str, maxWidth = 200, quality = 0.5) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/webp', quality));
                };
            });
        }

        function prepareQRPreview() {
            if (!selectedProduct) return;
            const modal = document.getElementById('qr-preview-modal');
            const qrWrapper = document.getElementById('print-qrcode-wrapper');
            qrWrapper.innerHTML = "";
            document.getElementById('print-name').innerText = selectedProduct.name;
            document.getElementById('print-id').innerText = "ID: " + selectedProduct.id;
            modal.style.display = 'flex';
            
            setTimeout(() => {
                try {
                    new QRCode(qrWrapper, { 
                        text: selectedProduct.id, 
                        width: 180, height: 180, 
                        colorDark : "#000000", colorLight : "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H 
                    });
                } catch (e) { console.error(e); }
            }, 300);
        }

        function closeQrModal() { document.getElementById('qr-preview-modal').style.display = 'none'; }

        // LÓGICA DE IMPRESSÃO VIA IFRAME (MUITO MAIS ESTÁVEL EM MOBILE)
        function executePrint() {
            const qrWrapper = document.getElementById('print-qrcode-wrapper');
            const canvas = qrWrapper.querySelector('canvas');
            const imgQr = qrWrapper.querySelector('img');
            
            // Forçamos a captura em Base64
            let qrBase64 = "";
            if (canvas) qrBase64 = canvas.toDataURL("image/png");
            else if (imgQr) qrBase64 = imgQr.src;

            const name = document.getElementById('print-name').innerText;
            const id = document.getElementById('print-id').innerText;

            // Criar iframe oculto
            let printFrame = document.getElementById('printFrame');
            if (!printFrame) {
                printFrame = document.createElement('iframe');
                printFrame.id = 'printFrame';
                printFrame.style.position = 'fixed';
                printFrame.style.right = '0';
                printFrame.style.bottom = '0';
                printFrame.style.width = '0';
                printFrame.style.height = '0';
                printFrame.style.border = '0';
                document.body.appendChild(printFrame);
            }

            const frameDoc = printFrame.contentWindow.document;
            frameDoc.open();
            frameDoc.write(`
                <html>
                    <head>
                        <title>Imprimir QR</title>
                        <style>
                            body { 
                                margin: 0; padding: 20px; 
                                font-family: sans-serif; 
                                display: flex; flex-direction: column; align-items: center; 
                                text-align: center;
                            }
                            .card {
                                border: 2px solid #000;
                                padding: 20px;
                                border-radius: 12px;
                                width: 240px;
                            }
                            .brand { font-size: 10px; color: #e91e63; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
                            .product { font-size: 18px; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
                            .qr-img { width: 180px; height: 180px; margin: 10px 0; }
                            .id-txt { font-family: monospace; font-size: 14px; font-weight: bold; background: #eee; padding: 4px; border-radius: 4px; }
                            @media print {
                                body { padding: 0; }
                                .card { border: 1px solid #000; }
                            }
                        </style>
                    </head>
                    <body>
                        <div class="card">
                            <div class="brand">Estoque Pro</div>
                            <div class="product">${name}</div>
                            <img src="${qrBase64}" class="qr-img">
                            <div class="id-txt">${id}</div>
                        </div>
                    </body>
                </html>
            `);
            frameDoc.close();

            // Disparar impressão após carregamento
            printFrame.contentWindow.focus();
            setTimeout(() => {
                printFrame.contentWindow.print();
            }, 500);
        }

        function filterLowStock() {
            activeFilterTag = null;
            renderCategoryChips();
            const low = products.filter(p => p.qty <= (p.alert || 0));
            renderSpecificList(low);
        }

        document.getElementById('global-search').addEventListener('input', (e) => renderInventory(e.target.value));
    </script>
</body>
</html>
